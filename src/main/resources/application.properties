spring.application.name=stand-backend
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ace_integration}
spring.datasource.username=${DB_USERNAME:ace_user}
spring.datasource.password=${DB_PASSWORD:senhe}
spring.jpa.properties.hibernate.default_schema=stand

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=80MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.storage.upload-dir=${UPLOAD_DIR:./uploads}
app.admin.email=${ADMIN_EMAIL:admin@stand.local}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
